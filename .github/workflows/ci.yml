name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Config. ambiente Node.js
        uses: actions/setup-node@v2.1.2

      - name: Instalando dependências
        run: npm ci

      - name: Rodando testes unitário
        run: npm run test
